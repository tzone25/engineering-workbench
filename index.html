<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Engineering Workbench">
<title>Engineering Workbench</title>

<style>
:root{
  --bg:#0b1120;
  --panel:#111827;
  --panel2:#182235;
  --border:#29364d;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --accent:#38bdf8;
  --green:#22c55e;
  --yellow:#f59e0b;
  --red:#ef4444;
  --purple:#a78bfa;
  --shadow:0 10px 30px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{
  width:245px;
  background:#080d18;
  border-right:1px solid var(--border);
  padding:18px 12px;
  position:fixed;
  left:0;top:0;bottom:0;
  overflow-y:auto;
  z-index:20
}
.logo{
  padding:10px 12px 18px;
  border-bottom:1px solid var(--border);
  margin-bottom:12px
}
.logo h1{font-size:19px;margin:0 0 4px}
.logo p{font-size:12px;color:var(--muted);margin:0}
.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#cbd5e1;
  text-align:left;
  padding:12px 13px;
  border-radius:9px;
  margin:2px 0;
  font-weight:600
}
.nav button:hover,.nav button.active{background:var(--panel2);color:white}
.main{margin-left:245px;width:calc(100% - 245px)}
.topbar{
  height:65px;
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(11,17,32,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px
}
.topbar h2{font-size:20px;margin:0}
.mobile-menu{display:none}
.content{padding:24px;max-width:1600px;margin:auto}
.grid{display:grid;gap:16px}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  box-shadow:var(--shadow)
}
.card h3,.card h4{margin:0 0 10px}
.stat{font-size:30px;font-weight:800;margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--border);
  background:var(--panel2);
  color:white;
  border-radius:8px;
  padding:9px 13px;
  font-weight:650
}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:#0369a1;border-color:#0284c7}
.btn.green{background:#166534;border-color:#22c55e}
.btn.red{background:#991b1b;border-color:#ef4444}
.btn.yellow{background:#92400e;border-color:#f59e0b}
.btn.purple{background:#5b21b6;border-color:#8b5cf6}
.btn.smallbtn{padding:6px 9px;font-size:12px}
input,select,textarea{
  width:100%;
  background:#0b1220;
  border:1px solid var(--border);
  color:white;
  border-radius:8px;
  padding:10px 11px;
  outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:100px;resize:vertical}
label{font-size:12px;color:#cbd5e1;font-weight:700;display:block;margin-bottom:5px}
.field{margin-bottom:13px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.formgrid .full{grid-column:1/-1}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{font-size:12px;color:#94a3b8}
td{font-size:13px}
.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:999px;
  background:#273449;
  font-size:11px;
  font-weight:700
}
.badge.green{background:#14532d;color:#bbf7d0}
.badge.red{background:#7f1d1d;color:#fecaca}
.badge.yellow{background:#78350f;color:#fde68a}
.badge.blue{background:#0c4a6e;color:#bae6fd}
.badge.purple{background:#4c1d95;color:#ddd6fe}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px
}
.section-title h3{margin:0}
.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--border);
  border-radius:10px
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:100
}
.modal.show{display:flex}
.modalbox{
  width:min(900px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:0 25px 80px rgba(0,0,0,.5);
  padding:20px
}
.modalhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}
.close{background:none;border:0;color:#94a3b8;font-size:26px}
.kpi{border-left:4px solid var(--accent)}
.quick{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}
.quick .btn{flex:1;min-width:150px}
.calc-tabs{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
  margin-bottom:16px
}
.calc-tab{
  padding:13px 10px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  color:white;
  text-align:center;
  font-weight:700
}
.calc-tab.active{border-color:var(--accent);background:#10283a}
.calc-panel{display:none}
.calc-panel.active{display:block}
.result{
  margin-top:12px;
  padding:13px;
  border-radius:9px;
  background:#0a1624;
  border:1px solid var(--border)
}
.result strong{font-size:20px}
.checklist label{
  display:flex;
  align-items:center;
  gap:9px;
  background:#0b1220;
  padding:11px;
  border:1px solid var(--border);
  border-radius:8px;
  margin:6px 0
}
.checklist input{width:auto}
.timeline{border-left:2px solid var(--border);padding-left:17px}
.timeline-item{position:relative;margin:0 0 18px}
.timeline-item:before{
  content:"";
  position:absolute;
  left:-24px;
  top:3px;
  width:9px;height:9px;
  border-radius:50%;
  background:var(--accent)
}
.searchbar{margin-bottom:15px}
.note{
  padding:11px 13px;
  border-radius:8px;
  background:#172033;
  border-left:3px solid var(--accent);
  font-size:13px
}
.warning{
  padding:12px;
  background:#3b2b0a;
  border:1px solid #8a6412;
  border-radius:9px;
  color:#fde68a;
  font-size:13px
}
.report-paper{
  background:white;
  color:#111;
  padding:35px;
  border-radius:4px;
  line-height:1.45
}
.report-paper h1{margin-top:0}
.report-paper table{color:#111}
.report-paper th,.report-paper td{border-bottom:1px solid #ccc}
hr{border:0;border-top:1px solid var(--border);margin:18px 0}

@media(max-width:900px){
  .sidebar{
    transform:translateX(-100%);
    transition:.2s
  }
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;width:100%}
  .mobile-menu{display:block}
  .topbar{padding:0 15px}
  .content{padding:15px}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){
  .grid2,.grid3,.grid4,.formgrid{grid-template-columns:1fr}
  .calc-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar h2{font-size:17px}
  .content{padding:11px}
  .card{padding:14px}
  table{display:block;overflow-x:auto}
  .quick .btn{min-width:100%}
}
@media print{
  body{background:white;color:black}
  .sidebar,.topbar,.no-print{display:none!important}
  .main{margin:0;width:100%}
  .content{padding:0}
  .report-paper{box-shadow:none;padding:20px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="logo">
    <h1>Engineering Workbench</h1>
    <p>Mechanical • Hydraulic • Maintenance</p>
  </div>

  <nav class="nav">
    <button data-page="dashboard">Dashboard</button>
    <button data-page="machines">Machines</button>
    <button data-page="projects">Projects</button>
    <button data-page="faults">AI Fault Finding</button>
    <button data-page="maintenance">Maintenance</button>
    <button data-page="reports">Reports</button>
    <button data-page="safety">Safety</button>
    <button data-page="engineering">Engineering Mode</button>
    <button data-page="hydraulics">Hydraulics</button>
    <button data-page="mechanical">Mechanical</button>
    <button data-page="machining">Machining</button>
    <button data-page="parts">Parts Search</button>
    <button data-page="backup">Backup / Restore</button>
  </nav>
</aside>

<main class="main">
  <header class="topbar">
    <button class="btn mobile-menu" onclick="toggleMenu()">☰</button>
    <h2 id="pageTitle">Dashboard</h2>
    <div class="actions">
      <button class="btn smallbtn" onclick="toggleTheme()">☾</button>
    </div>
  </header>

  <section class="content" id="content"></section>
</main>
</div>

<div class="modal" id="modal">
  <div class="modalbox">
    <div class="modalhead">
      <h3 id="modalTitle">Form</h3>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* ============================================================
   ENGINEERING WORKBENCH
   Single-file offline application
   ============================================================ */

const KEY="engineering_workbench_v4";

const blankDB={
  machines:[],
  parts:[],
  faults:[],
  maintenance:[],
  projects:[],
  safety:[],
  calculations:[],
  reports:[],
  activity:[]
};

let db=loadDB();
let currentPage="dashboard";

function loadDB(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    return x ? {...blankDB,...x} : structuredClone(blankDB);
  }catch(e){
    return structuredClone(blankDB);
  }
}

function saveDB(){
  localStorage.setItem(KEY,JSON.stringify(db));
}

function uid(prefix){
  return prefix+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
}

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function now(){
  return new Date().toISOString();
}

function dateOnly(v){
  if(!v)return "";
  return new Date(v).toLocaleDateString("en-AU");
}

function dateTime(v){
  if(!v)return "";
  return new Date(v).toLocaleString("en-AU");
}

function addActivity(text,type="General"){
  db.activity.unshift({
    id:uid("act"),
    text,
    type,
    date:now()
  });
  db.activity=db.activity.slice(0,100);
  saveDB();
}

function machineName(id){
  const m=db.machines.find(x=>x.id===id);
  return m ? `${m.name} (${m.machineId||""})` : "Unassigned";
}

function openModal(title,html){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=html;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("open");
}

function navigate(page){
  currentPage=page;
  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===page);
  });
  const titles={
    dashboard:"Dashboard",
    machines:"Machines",
    projects:"Projects",
    faults:"AI Fault Finding",
    maintenance:"Maintenance",
    reports:"Reports",
    safety:"Safety",
    engineering:"Engineering Mode",
    hydraulics:"Hydraulic Troubleshooting",
    mechanical:"Mechanical Troubleshooting",
    machining:"Machining",
    parts:"Parts Search",
    backup:"Backup / Restore"
  };
  document.getElementById("pageTitle").textContent=titles[page]||"Engineering Workbench";
  render();
  if(innerWidth<901)document.getElementById("sidebar").classList.remove("open");
}

document.querySelectorAll(".nav button").forEach(b=>{
  b.addEventListener("click",()=>navigate(b.dataset.page));
});

/* ============================================================
   DASHBOARD
   ============================================================ */

function dashboard(){
  const openFaults=db.faults.filter(f=>f.status!=="Closed").length;
  const activeMaint=db.maintenance.filter(m=>m.status!=="Complete").length;
  const attention=db.machines.filter(m=>m.status==="Attention"||m.status==="Down").length;

  return `
  <div class="grid grid4">
    <div class="card kpi">
      <div class="muted">Machines</div>
      <div class="stat">${db.machines.length}</div>
    </div>
    <div class="card kpi">
      <div class="muted">Open Faults</div>
      <div class="stat">${openFaults}</div>
    </div>
    <div class="card kpi">
      <div class="muted">Maintenance</div>
      <div class="stat">${activeMaint}</div>
    </div>
    <div class="card kpi">
      <div class="muted">Attention</div>
      <div class="stat">${attention}</div>
    </div>
  </div>

  <div style="height:16px"></div>

  <div class="card">
    <div class="section-title">
      <h3>Quick Actions</h3>
    </div>
    <div class="quick">
      <button class="btn primary" onclick="openFault()">Report Fault</button>
      <button class="btn green" onclick="openMaintenance()">Maintenance</button>
      <button class="btn purple" onclick="navigate('engineering')">Engineering Calculator</button>
      <button class="btn yellow" onclick="openMachine()">Add Machine</button>
    </div>
  </div>

  <div style="height:16px"></div>

  <div class="grid grid2">
    <div class="card">
      <div class="section-title">
        <h3>Machines Needing Attention</h3>
        <button class="btn smallbtn" onclick="navigate('machines')">View</button>
      </div>
      ${db.machines.filter(m=>m.status==="Attention"||m.status==="Down").slice(0,6).map(m=>`
        <div class="note" style="margin:7px 0">
          <strong>${esc(m.name)}</strong><br>
          <span class="muted">${esc(m.machineId)} • ${esc(m.status)}</span>
        </div>
      `).join("")||`<div class="empty">No machines currently flagged.</div>`}
    </div>

    <div class="card">
      <div class="section-title">
        <h3>Recent Activity</h3>
      </div>
      ${db.activity.slice(0,7).map(a=>`
        <div style="padding:9px 0;border-bottom:1px solid var(--border)">
          <strong>${esc(a.text)}</strong>
          <div class="small muted">${dateTime(a.date)}</div>
        </div>
      `).join("")||`<div class="empty">No activity yet.</div>`}
    </div>
  </div>

  <div style="height:16px"></div>

  <div class="warning">
    <strong>Safety:</strong> This application is an engineering aid. Always follow site isolation procedures, manufacturer requirements, applicable NSW WHS requirements and competent-person requirements. Electrical testing, isolation, wiring and control work must be performed by a suitably qualified electrician.
  </div>
  `;
}

/* ============================================================
   MACHINES
   ============================================================ */

function openMachine(id=null){
  const m=id?db.machines.find(x=>x.id===id):{};
  openModal(id?"Edit Machine":"Add Machine",`
    <div class="formgrid">
      <div class="field">
        <label>Machine Name</label>
        <input id="mName" value="${esc(m.name)}">
      </div>
      <div class="field">
        <label>Machine ID</label>
        <input id="mId" value="${esc(m.machineId)}" placeholder="e.g. PRESS-001">
      </div>
      <div class="field">
        <label>Manufacturer</label>
        <input id="mManufacturer" value="${esc(m.manufacturer)}">
      </div>
      <div class="field">
        <label>Model</label>
        <input id="mModel" value="${esc(m.model)}">
      </div>
      <div class="field">
        <label>Serial Number</label>
        <input id="mSerial" value="${esc(m.serial)}">
      </div>
      <div class="field">
        <label>Location</label>
        <input id="mLocation" value="${esc(m.location)}">
      </div>
      <div class="field">
        <label>Operating Hours</label>
        <input id="mHours" type="number" value="${esc(m.hours||0)}">
      </div>
      <div class="field">
        <label>Criticality</label>
        <select id="mCriticality">
          ${["Low","Medium","High","Critical"].map(x=>`<option ${m.criticality===x?"selected":""}>${x}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="mStatus">
          ${["Running","Attention","Down","Maintenance"].map(x=>`<option ${m.status===x?"selected":""}>${x}</option>`).join("")}
        </select>
      </div>
      <div class="field full">
        <label>Description / Notes</label>
        <textarea id="mNotes">${esc(m.notes)}</textarea>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" onclick="saveMachine('${id||""}')">Save Machine</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div>
  `);
}

function saveMachine(id){
  const obj={
    id:id||uid("machine"),
    name:document.getElementById("mName").value.trim(),
    machineId:document.getElementById("mId").value.trim(),
    manufacturer:document.getElementById("mManufacturer").value.trim(),
    model:document.getElementById("mModel").value.trim(),
    serial:document.getElementById("mSerial").value.trim(),
    location:document.getElementById("mLocation").value.trim(),
    hours:Number(document.getElementById("mHours").value)||0,
    criticality:document.getElementById("mCriticality").value,
    status:document.getElementById("mStatus").value,
    notes:document.getElementById("mNotes").value
  };

  if(!obj.name){
    alert("Enter a machine name.");
    return;
  }

  if(id){
    const i=db.machines.findIndex(x=>x.id===id);
    db.machines[i]=obj;
    addActivity(`Updated machine ${obj.name}`,"Machine");
  }else{
    db.machines.unshift(obj);
    addActivity(`Added machine ${obj.name}`,"Machine");
  }
  saveDB();
  closeModal();
  render();
}

function deleteMachine(id){
  if(!confirm("Delete this machine? Linked records will remain but will show as unassigned."))return;
  const m=db.machines.find(x=>x.id===id);
  db.machines=db.machines.filter(x=>x.id!==id);
  addActivity(`Deleted machine ${m?.name||"machine"}`,"Machine");
  saveDB();
  render();
}

function machineCard(m){
  const parts=db.parts.filter(p=>p.machineId===m.id);
  const faults=db.faults.filter(f=>f.machineId===m.id);
  const maint=db.maintenance.filter(x=>x.machineId===m.id);

  return `
  <div class="card">
    <div class="section-title">
      <div>
        <h3>${esc(m.name)}</h3>
        <span class="badge blue">${esc(m.machineId||"No ID")}</span>
        <span class="badge">${esc(m.status)}</span>
      </div>
      <div class="actions">
        <button class="btn smallbtn" onclick="openMachine('${m.id}')">Edit</button>
        <button class="btn smallbtn red" onclick="deleteMachine('${m.id}')">Delete</button>
      </div>
    </div>

    <div class="grid grid3">
      <div><span class="muted small">Manufacturer</span><br>${esc(m.manufacturer||"-")}</div>
      <div><span class="muted small">Model</span><br>${esc(m.model||"-")}</div>
      <div><span class="muted small">Location</span><br>${esc(m.location||"-")}</div>
      <div><span class="muted small">Hours</span><br>${m.hours||0}</div>
      <div><span class="muted small">Criticality</span><br>${esc(m.criticality)}</div>
      <div><span class="muted small">Serial</span><br>${esc(m.serial||"-")}</div>
    </div>

    <hr>

    <div class="grid grid4">
      <div><strong>${parts.length}</strong><br><span class="muted small">Parts</span></div>
      <div><strong>${faults.length}</strong><br><span class="muted small">Faults</span></div>
      <div><strong>${maint.length}</strong><br><span class="muted small">Maintenance</span></div>
      <div><strong>${db.safety.filter(s=>s.machineId===m.id).length}</strong><br><span class="muted small">Safety</span></div>
    </div>

    <div class="actions" style="margin-top:14px">
      <button class="btn primary smallbtn" onclick="viewMachine('${m.id}')">Open Machine</button>
      <button class="btn smallbtn" onclick="openPart(null,'${m.id}')">Add Part</button>
      <button class="btn smallbtn" onclick="openFault(null,'${m.id}')">Report Fault</button>
      <button class="btn smallbtn" onclick="openMaintenance(null,'${m.id}')">Maintenance</button>
    </div>
  </div>`;
}

function machinesPage(){
  return `
  <div class="section-title">
    <div>
      <h3>Machine Register</h3>
      <div class="muted small">Every machine keeps its own parts, faults, maintenance, safety and history.</div>
    </div>
    <button class="btn primary" onclick="openMachine()">+ Machine</button>
  </div>

  <div class="searchbar">
    <input id="machineSearch" placeholder="Search machines..." oninput="filterMachines()">
  </div>

  <div class="grid grid2" id="machineList">
    ${db.machines.map(machineCard).join("")||`<div class="empty">No machines yet. Add your first machine.</div>`}
  </div>`;
}

function filterMachines(){
  const q=document.getElementById("machineSearch").value.toLowerCase();
  const items=db.machines.filter(m=>
    [m.name,m.machineId,m.manufacturer,m.model,m.location].join(" ").toLowerCase().includes(q)
  );
  document.getElementById("machineList").innerHTML=

function runAIFromForm(){
  const symptoms=[
    document.getElementById("fTitle").value,
    document.getElementById("fSymptoms").value,
    document.getElementById("fComponent").value,
    document.getElementById("fMeasurements").value
  ].join(" ").toLowerCase();

  let causes=[];

  diagnosticRules.forEach(rule=>{
    let score=0;
    rule.keywords.forEach(k=>{
      if(symptoms.includes(k))score++;
    });
    if(score) {
      rule.causes.forEach(c=>{
        causes.push({
          name:c[0],
          score:c[1]+score*3,
          check:c[2]
        });
      });
    }
  });

  const unique={};
  causes.forEach(c=>{
    if(!unique[c.name]||unique[c.name].score<c.score)unique[c.name]=c;
  });

  causes=Object.values(unique).sort((a,b)=>b.score-a.score).slice(0,6);

  if(!causes.length){
    document.getElementById("aiResult").innerHTML=`
      <div class="note">
        <strong>No strong pattern found.</strong><br>
        Record more specific symptoms and measurements. Useful inputs include pressure, flow, temperature, vibration, noise, speed, timing and component condition.
      </div>`;
    return;
  }

  document.getElementById("aiResult").innerHTML=`
    <div class="card">
      <h4>AI-Assisted Diagnostic Suggestions</h4>
      <p class="small muted">These are ranked diagnostic possibilities, not a confirmed diagnosis.</p>
      ${causes.map((c,i)=>`
        <div class="note" style="margin:8px 0">
          <strong>${i+1}. ${esc(c.name)}</strong>
          <span class="badge blue">${Math.min(99,c.score)}%</span>
          <br>${esc(c.check)}
        </div>`).join("")}
    </div>`;
}

function runAIForFault(id){
  const f=db.faults.find(x=>x.id===id);
  const symptoms=[
    f.title,f.symptoms,f.component,
    f.measurements,f.pressure,f.flow,f.temperature,f.vibration
  ].join(" ").toLowerCase();

  let causes=[];
  diagnosticRules.forEach(rule=>{
    let hits=rule.keywords.filter(k=>symptoms.includes(k)).length;
    if(hits)rule.causes.forEach(c=>causes.push({
      name:c[0],score:c[1]+hits*3,check:c[2]
    }));
  });

  const unique={};
  causes.forEach(c=>{
    if(!unique[c.name]||unique[c.name].score<c.score)unique[c.name]=c;
  });
  causes=Object.values(unique).sort((a,b)=>b.score-a.score).slice(0,6);

  document.getElementById("faultAI").innerHTML=`
    <div class="card">
      <h4>Suggested Diagnostic Checks</h4>
      ${causes.map(c=>`
        <div class="note" style="margin:6px 0">
          <strong>${esc(c.name)}</strong> — ${Math.min(99,c.score)}% pattern match<br>
          ${esc(c.check)}
        </div>`).join("")||`<div class="empty">More information required.</div>`}
    </div>`;
}

function saveMaintenance(id){
  const checks=[];
  for(let i=0;i<10;i++)checks.push(document.getElementById("pm"+i)?.checked||false);

  const x={
    id:id&&id!=="new"?id:uid("maint"),
    machineId:document.getElementById("mtMachine").value,
    title:document.getElementById("mtTitle").value.trim(),
    type:document.getElementById("mtType").value,
    date:document.getElementById("mtDate").value,
    hours:Number(document.getElementById("mtHours").value)||0,
    status:document.getElementById("mtStatus").value,
    work:document.getElementById("mtWork").value,
    measurements:document.getElementById("mtMeasurements").value,
    partsUsed:document.getElementById("mtParts").value,
    recommendations:document.getElementById("mtRecommendations").value,
    technician:document.getElementById("mtTech").value,
    signoff:document.getElementById("mtSignoff").value,
    checks
  };

  if(!x.title){
    alert("Enter a maintenance title.");
    return;
  }

  if(id&&id!=="new")db.maintenance[db.maintenance.findIndex(z=>z.id===id)]=x;
  else db.maintenance.unshift(x);

  addActivity(`${id&&id!=="new"?"Updated":"Created"} maintenance: ${x.title}`,"Maintenance");
  saveDB();
  closeModal();
  render();
}

function maintenancePage(){
  const today=new Date().toISOString().slice(0,10);

  if(c==="units")return `

      ${calcCard("Length mm ↔ inch",`
        <div class="field"><label>Value</label><input id="c_um" type="number"></div>
        <button class="btn primary" onclick="convertMM()">Convert</button>
        <div id="r_mm"></div>
      `)}
      ${calcCard("Pressure bar ↔ psi",`
        <div class="field"><label>bar</label><input id="c_bar" type="number"></div>
        <button class="btn primary" onclick="convertBar()">Convert</button>
        <div id="r_bar"></div>

      ${calcCard("Flow L/min ↔ GPM",`
        <div class="field"><label>L/min</label><input id="c_lpm" type="number"></div>
        <button class="btn primary" onclick="convertFlow()">Convert</button>

      ${calcCard("Power kW ↔ HP",`
        <div class="field"><label>kW</label><input id="c_kw" type="number"></div>
        <button class="btn primary" onclick="convertKW()">Convert</button>

      ${calcCard("Torque Nm ↔ ft-lb",`
        <div class="field"><label>Nm</label><input id="c_nm" type="number"></div>
        <button class="btn primary" onclick="convertNm()">Convert</button>
        <div id="r_nm"></div>

      ${calcCard("Temperature °C ↔ °F",`
        <div class="field"><label>°C</label><input id="c_c" type="number"></div>
        <button class="btn primary" onclick="convertTemp()">Convert</button>
        <div id="r_c"></div>

    </div>`;

  return "";
}

function calcCard(title,body){
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}

function showResult(id,text,name){
  document.getElementById(id).innerHTML=`<div class="result"><strong>${esc(text)}</strong></div>`;
  saveCalculation(name,text);
}

function saveCalculation(name,result,machineId="",projectId=""){
  db.calculations.unshift({
    id:uid("calc"),name,result,machineId,projectId,date:now()
  });
  db.calculations=db.calculations.slice(0,100);
  saveDB();
}

/* Calculators */

function n(id){return Number(document.getElementById(id).value)}

function calcForce(){
  const r=n("c_mass")*n("c_g");
  showResult("r_force",r.toFixed(2)+" N","Force from Mass");
}
function calcTorque(){
  const r=n("c_tf")*n("c_tl");
  showResult("r_torque",r.toFixed(2)+" Nm","Torque");
}
function calcPower(){
  const r=n("c_pt")*n("c_pr")/9550;
  showResult("r_power",r.toFixed(2)+" kW","Power");
}
function calcMoment(){
  const r=n("c_mf")*n("c_md");
  showResult("r_moment",r.toFixed(2)+" Nm","Moment");
}
function calcShaftStress(){
  const T=n("c_st")*1000;
  const d=n("c_sd");
  const r=16*T/(Math.PI*Math.pow(d,3));
  showResult("r_ss",r.toFixed(2)+" MPa","Shaft torsional stress");
}
function calcShaftDiameter(){
  const T=n("c_dt")*1000;
  const tau=n("c_ds");
  const d=Math.pow(16*T/(Math.PI*tau),1/3);
  showResult("r_sd",d.toFixed(2)+" mm","Shaft diameter");
}
function calcStress(){
  const r=n("c_sf")/n("c_sa");
  showResult("r_stress",r.toFixed(2)+" MPa","Stress");
}
function calcStrain(){
  const r=n("c_dl")/n("c_l");
  showResult("r_strain",r.toExponential(4),"Strain");
}
function calcBeam(){
  const P=n("c_bl"),L=n("c_bs"),E=n("c_be")*1000,I=n("c_bi");
  const delta=P*Math.pow(L*1000,3)/(48*E*I);
  showResult("r_beam",delta.toFixed(3)+" mm","Beam centre load deflection");
}
function calcRectI(){
  const b=n("c_ib"),h=n("c_ih");
  const I=b*Math.pow(h,3)/12;
  showResult("r_ri",I.toFixed(2)+" mm⁴","Rectangular section I");
}
function calcGear(){
  const ratio=n("c_gn")/n("c_gd");
  const rpm=n("c_gr")/ratio;
  showResult("r_gear","Ratio "+ratio.toFixed(3)+" : 1 • Driven RPM "+rpm.toFixed(1),"Gear ratio");
}
function calcBelt(){
  const rpm=n("c_bpr")*n("c_bpd")/n("c_bpn");
  showResult("r_belt",rpm.toFixed(1)+" RPM","Belt pulley speed");
}
function calcLinearSpeed(){
  const d=n("c_lpd")/1000;
  const v=Math.PI*d*n("c_lpr")/60;
  showResult("r_ls",v.toFixed(3)+" m/s","Linear belt speed");
}
function calcBolt(){
  const r=n("c_bf")/n("c_ba");
  showResult("r_bolt",r.toFixed(2)+" MPa","Bolt stress");
}
function calcSpring(){
  const r=n("c_sr")*n("c_sx");
  showResult("r_spring",r.toFixed(2)+" N","Spring force");
}
function calcCylinder(){
  const area=Math.PI*Math.pow(n("c_hd")/2,2);
  const F=n("c_hp")*100000*area/1000000;
  showResult("r_cylinder",F.toFixed(1)+" N ("+(F/1000).toFixed(2)+" kN)","Hydraulic cylinder force");
}
function calcCylinderSpeed(){
  const area=Math.PI*Math.pow(n("c_hbd")/2,2);
  const q=n("c_hf")/60000;
  const v=q/(area/1000000);
  showResult("r_cs",v.toFixed(3)+" m/s","Cylinder speed");
}
function calcHydPower(){
  const r=n("c_hpp")*n("c_hff")/600;
  showResult("r_hp",r.toFixed(2)+" kW","Hydraulic power");
}
function calcPumpDisp(){
  const eff=n("c_pde")/100;
  const r=n("c_pdflow")*1000/(n("c_pdrpm")*eff);
  showResult("r_pd",r.toFixed(2)+" cc/rev","Pump displacement");
}
function calcMotorTorque(){
  const r=(n("c_hmtp")*n("c_hmtd")/(62.83))*(n("c_hmte")/100);
  showResult("r_mt",r.toFixed(2)+" Nm","Hydraulic motor torque");
}
function calcThermal(){
  const r=n("c_tel")*n("c_tea")*n("c_tet");
  showResult("r_te",r.toFixed(3)+" mm","Thermal expansion");
}
function calcMass(){
  const r=n("c_mv")*n("c_mdensity");
  showResult("r_mass",r.toFixed(3),"Mass = volume × density");
}
function convertMM(){
  const x=n("c_um");
  showResult("r_mm",x+" mm = "+(x/25.4).toFixed(4)+" in","Length conversion");
}
function convertBar(){
  const x=n("c_bar");
  showResult("r_bar",x+" bar = "+(x*14.5038).toFixed(2)+" psi","Pressure conversion");
}
function convertFlow(){
  const x=n("c_lpm");
  showResult("r_flow",x+" L/min = "+(x*0.264172).toFixed(2)+" US GPM","Flow conversion");
}
function convertKW(){
  const x=n("c_kw");
  showResult("r_kw",x+" kW = "+(x*1.34102).toFixed(2)+" HP","Power conversion");
}
function convertNm(){
  const x=n("c_nm");
  showResult("r_nm",x+" Nm = "+(x*0.737562).toFixed(2)+" ft-lb","Torque conversion");
}
function convertTemp(){
  const x=n("c_c");
  showResult("r_c",x+" °C = "+((x*9/5)+32).toFixed(2)+" °F","Temperature conversion");
}

    machineId:document.getElementById("rpMachine").value,
    projectId:document.getElementById("rpProject").value,
    number:document.getElementById("rpNumber").value,
    title:document.getElementById("rpTitle").value,
    body:document.getElementById("rpBody").value,
    prepared:document.getElementById("rpPrepared").value,
    approved:document.getElementById("rpApproved").value,

  else db.reports.unshift(r);

  addActivity(`${id?"Updated":"Created"} report: ${r.title}`,"Report");
  saveDB();
  closeModal();
  render();
}

  const faults=db.faults.filter(f=>(p.machineIds||[]).includes(f.machineId));
  const maint=db.maintenance.filter(m=>(p.machineIds||[]).includes(m.machineId));

  const body=
`PROJECT ENGINEERING REPORT

PROJECT:
${p.name}

PROJECT NUMBER:
${p.number||"-"}

CUSTOMER / SITE:
${p.customer||"-"}

STATUS:
${p.status}

START:
${dateOnly(p.start)}

TARGET:
${dateOnly(p.target)}

DESCRIPTION
${p.description||"-"}

ENGINEERING NOTES
${p.notes||"-"}

MACHINES
${(p.machineIds||[]).map(id=>"- "+machineName(id)).join("\n")||"-"}

FAULTS / BREAKDOWNS
${faults.map(f=>"- "+f.title+" — "+f.status).join("\n")||"-"}

MAINTENANCE
${maint.map(m=>"- "+m.title+" — "+m.type+" — "+m.status).join("\n")||"-"}

FINAL RECOMMENDATIONS
`;

  const r={
    id:uid("report"),
    type:"Project",
    machineId:"",
    projectId:id,
    number:p.number||"",
    title:`${p.name} — Project Report`,
    body,
    prepared:"",
    approved:"",
    date:now()
  };

  db.reports.unshift(r);
  saveDB();
  closeModal();
  openReport(r.id);
}

function reportsPage(){
  return `
  <div class="section-title">
    <div>
      <h3>Reports</h3>
      <div class="muted small">Machine maintenance, preventive maintenance, faults and projects.</div>
    </div>
    <button class="btn primary" onclick="openReport()">+ Report</button>
  </div>

  <div class="card">
    ${db.reports.length?`
      <table>
        <thead><tr><th>Report</th><th>Type</th><th>Machine / Project</th><th>Date</th><th></th></tr></thead>
        <tbody>
        ${db.reports.map(r=>`
          <tr>
            <td><strong>${esc(r.title)}</strong><br>${esc(r.number||"")}</td>
            <td>${esc(r.type)}</td>
            <td>${esc(r.machineId?machineName(r.machineId):r.projectId?(db.projects.find(p=>p.id===r.projectId)?.name||"Project"):"-")}</td>
            <td>${dateOnly(r.date)}</td>
            <td>
              <button class="btn smallbtn" onclick="openReport('${r.id}')">Edit</button>
              <button class="btn smallbtn yellow" onclick="printReport('${r.id}')">PDF</button>
            </td>
          </tr>`).join("")}
        </tbody>
      </table>
    `:`<div class="empty">No reports yet.</div>`}
  </div>`;
}

function printReport(id){
  const r=db.reports.find(x=>x.id===id);
  if(!r)return;

  const machine=r.machineId?machineName(r.machineId):"";
  const project=r.projectId?(db.projects.find(p=>p.id===r.projectId)?.name||""):"";

  const win=window.open("","_blank");
  win.document.write(`
  <!doctype html>
  <html>
  <head>
    <title>${esc(r.title)}</title>
    <style>
      body{font-family:Arial,sans-serif;margin:40px;color:#111}
      h1{margin-bottom:4px}
      .meta{color:#555;margin-bottom:25px}
      .body{white-space:pre-wrap;line-height:1.55}
      .sign{margin-top:50px;border-top:1px solid #aaa;padding-top:10px}
      @media print{body{margin:20mm}}
    </style>
  </head>
  <body>
    <h1>${esc(r.title)}</h1>
    <div class="meta">
      ${esc(r.type)}<br>
      Report No: ${esc(r.number||"-")}<br>
      Date: ${dateOnly(r.date)}<br>
      ${machine?"Machine: "+esc(machine)+"<br>":""}
      ${project?"Project: "+esc(project):""}
    </div>
    <div class="body">${esc(r.body)}</div>
    <div class="sign">
      Prepared by: ${esc(r.prepared||"-")}<br><br>
      Approved / Signed: ${esc(r.approved||"-")}
    </div>
    <script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script>
  </body>
  </html>`);
  win.document.close();
}

/* ============================================================
   BACKUP
   ============================================================ */

function backupPage(){
  return `
  <div class="grid grid2">
    <div class="card">
      <h3>Backup</h3>
      <p class="muted">Download all machines, parts, faults, maintenance, projects, reports and calculations as JSON.</p>
      <button class="btn primary" onclick="exportData()">Download Backup</button>
    </div>

    <div class="card">
      <h3>Restore</h3>
      <p class="muted">Restore a previous Engineering Workbench JSON backup.</p>
      <input type="file" id="restoreFile" accept=".json">
      <button class="btn yellow" style="margin-top:10px" onclick="importData()">Restore Backup</button>
    </div>

    <div class="card">
      <h3>Storage</h3>
      <div class="grid grid3">
        <div><strong>${db.machines.length}</strong><br><span class="muted">Machines</span></div>
        <div><strong>${db.parts.length}</strong><br><span class="muted">Parts</span></div>
        <div><strong>${db.faults.length}</strong><br><span class="muted">Faults</span></div>
        <div><strong>${db.maintenance.length}</strong><br><span class="muted">Maintenance</span></div>
        <div><strong>${db.projects.length}</strong><br><span class="muted">Projects</span></div>
        <div><strong>${db.reports.length}</strong><br><span class="muted">Reports</span></div>
      </div>
    </div>

    <div class="card">
      <h3>Reset</h3>
      <p class="muted">Permanently deletes all data stored in this browser.</p>
      <button class="btn red" onclick="resetData()">Reset Everything</button>
    </div>
  </div>`;
}

function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="engineering-workbench-backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(){
  const file=document.getElementById("restoreFile").files[0];
  if(!file)return alert("Choose a JSON backup first.");

  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const imported=JSON.parse(e.target.result);
      if(!imported.machines||!imported.parts)throw new Error("Invalid backup");
      db={...blankDB,...imported};
      saveDB();
      alert("Backup restored.");
      render();
    }catch(err){
      alert("Could not restore this file.");
    }
  };
  reader.readAsText(file);
}

function resetData(){
  if(!confirm("Delete ALL Engineering Workbench data? This cannot be undone unless you have a backup."))return;
  localStorage.removeItem(KEY);
  db=structuredClone(blankDB);
  render();
}

/* ============================================================
   REPORT LINKS / GENERAL
   ============================================================ */

function render(){
  const pages={
    dashboard:dashboard,
    machines:machinesPage,
    projects:projectsPage,
    faults:faultsPage,
    maintenance:maintenancePage,
    reports:reportsPage,
    safety:safetyPage,
    engineering:engineeringPage,
    hydraulics:hydraulicsPage,
    mechanical:mechanicalPage,
    machining:machiningPage,
    parts:partsPage,
    backup:backupPage
  };

  document.getElementById("content").innerHTML=(pages[currentPage]||dashboard)();
  document.querySelectorAll(".nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===currentPage);
  });
}

function toggleTheme(){
  const light=document.body.dataset.theme==="light";
  if(light){
    document.body.dataset.theme="";
    document.documentElement.style.setProperty("--bg","#0b1120");
    document.documentElement.style.setProperty("--panel","#111827");
    document.documentElement.style.setProperty("--panel2","#182235");
    document.documentElement.style.setProperty("--text","#f3f4f6");
    localStorage.setItem("ew_theme","dark");
  }else{
    document.body.dataset.theme="light";
    document.documentElement.style.setProperty("--bg","#eef2f7");
    document.documentElement.style.setProperty("--panel","#ffffff");
    document.documentElement.style.setProperty("--panel2","#e5e7eb");
    document.documentElement.style.setProperty("--text","#111827");
    document.documentElement.style.setProperty("--border","#cbd5e1");
    document.documentElement.style.setProperty("--muted","#64748b");
    localStorage.setItem("ew_theme","light");
  }
}

if(localStorage.getItem("ew_theme")==="light")toggleTheme();

render();

/* Close modal when clicking outside */
document.getElementById("modal").addEventListener("click",e=>{
  if(e.target.id==="modal")closeModal();
});
</script>
</body>
