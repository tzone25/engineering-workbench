<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Engineering Workbench">

<title>Engineering Workbench</title>

<style>
:root{
 --bg:#f3f4f6;
 --card:#ffffff;
 --text:#111827;
 --muted:#6b7280;
 --line:#e5e7eb;
 --accent:#2563eb;
 --accent2:#1d4ed8;
 --danger:#dc2626;
 --success:#16a34a;
 --warning:#d97706;
 --shadow:0 8px 25px rgba(0,0,0,.07);
}

*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
}

body.dark{
 --bg:#0b1120;
 --card:#111827;
 --text:#f9fafb;
 --muted:#9ca3af;
 --line:#273244;
 --accent:#3b82f6;
 --accent2:#2563eb;
 --shadow:0 8px 25px rgba(0,0,0,.25);
}

button,input,select,textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

.app{
 min-height:100vh;
 display:flex;
}

.sidebar{
 width:250px;
 position:fixed;
 top:0;
 bottom:0;
 left:0;
 background:#111827;
 color:white;
 padding:18px;
 overflow-y:auto;
 z-index:100;
}

.brand{
 font-size:20px;
 font-weight:800;
 margin:5px 7px 22px;
}

.brand small{
 display:block;
 color:#9ca3af;
 font-size:11px;
 font-weight:500;
 margin-top:4px;
}

.nav{
 display:flex;
 flex-direction:column;
 gap:3px;
}

.nav button{
 width:100%;
 border:0;
 background:transparent;
 color:#d1d5db;
 text-align:left;
 padding:11px 12px;
 border-radius:9px;
}

.nav button:hover,
.nav button.active{
 background:#1f2937;
 color:white;
}

.content{
 margin-left:250px;
 width:calc(100% - 250px);
 max-width:1700px;
 padding:25px;
}

.mobile-menu{
 display:none;
 position:fixed;
 top:10px;
 left:10px;
 z-index:200;
}

.page-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 margin-bottom:18px;
}

.page-header h1{
 margin:0;
 font-size:28px;
}

.page-header p{
 margin:4px 0 0;
 color:var(--muted);
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:14px;
 padding:17px;
 box-shadow:var(--shadow);
 margin-bottom:16px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:14px;
}

.grid2{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:14px;
}

.grid3{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:14px;
}

.stat strong{
 display:block;
 font-size:30px;
}

.stat span{
 color:var(--muted);
 font-size:13px;
}

.row{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 align-items:center;
}

.between{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.field{
 margin-bottom:12px;
}

.field label{
 display:block;
 font-size:12px;
 font-weight:700;
 margin-bottom:5px;
}

input,
select,
textarea{
 width:100%;
 padding:10px 11px;
 border:1px solid #d1d5db;
 border-radius:9px;
 background:var(--card);
 color:var(--text);
}

textarea{
 min-height:100px;
 resize:vertical;
}

.btn{
 border:0;
 border-radius:9px;
 padding:10px 13px;
 background:#e5e7eb;
 color:#111827;
}

.btn:hover{
 opacity:.9;
}

.btn.primary{
 background:var(--accent);
 color:white;
}

.btn.success{
 background:#dcfce7;
 color:#166534;
}

.btn.warning{
 background:#fef3c7;
 color:#92400e;
}

.btn.danger{
 background:#fee2e2;
 color:#991b1b;
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:999px;
 background:#e5e7eb;
 font-size:11px;
 font-weight:700;
}

.badge.success{
 background:#dcfce7;
 color:#166534;
}

.badge.warning{
 background:#fef3c7;
 color:#92400e;
}

.badge.danger{
 background:#fee2e2;
 color:#991b1b;
}

.warning{
 background:#fff7ed;
 border:1px solid #fed7aa;
 color:#9a3412;
 padding:11px;
 border-radius:10px;
 font-size:12px;
 margin-bottom:12px;
}

body.dark .warning{
 background:#431407;
 border-color:#7c2d12;
 color:#fed7aa;
}

.table-wrap{
 overflow:auto;
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:700px;
}

th,td{
 padding:10px;
 text-align:left;
 border-bottom:1px solid var(--line);
 vertical-align:top;
}

th{
 color:var(--muted);
 font-size:12px;
}

.history{
 border-left:3px solid var(--accent);
 padding:9px 0 9px 12px;
 margin:8px 0;
}

.empty{
 padding:25px;
 text-align:center;
 color:var(--muted);
}

.search{
 max-width:380px;
}

.quick-grid{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:10px;
}

.quick{
 border:1px solid var(--line);
 background:var(--card);
 border-radius:12px;
 padding:15px;
 text-align:left;
}

.quick:hover{
 border-color:var(--accent);
}

.quick b{
 display:block;
 margin-bottom:5px;
}

.quick span{
 color:var(--muted);
 font-size:12px;
}

.calc-grid{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:10px;
}

.calc-card{
 border:1px solid var(--line);
 background:var(--card);
 border-radius:12px;
 padding:15px;
 text-align:left;
}

.calc-card b{
 display:block;
 margin-bottom:5px;
}

.calc-card span{
 color:var(--muted);
 font-size:12px;
}

.result{
 background:#eff6ff;
 border:1px solid #bfdbfe;
 border-radius:10px;
 padding:13px;
 margin-top:12px;
 font-weight:700;
}

body.dark .result{
 background:#172554;
 border-color:#1e40af;
}

.check{
 display:flex;
 gap:8px;
 align-items:flex-start;
 padding:8px 0;
}

.check input{
 width:auto;
 margin-top:4px;
}

.signature{
 border:1px dashed #9ca3af;
 border-radius:10px;
 padding:15px;
 color:var(--muted);
}

.tabs{
 display:flex;
 gap:7px;
 overflow:auto;
 margin-bottom:14px;
}

.tabs button{
 white-space:nowrap;
}

.small{
 font-size:12px;
 color:var(--muted);
}

.report-section{
 margin-top:20px;
}

.report-section h3{
 border-bottom:1px solid var(--line);
 padding-bottom:6px;
}

@media(max-width:1000px){

 .sidebar{
  transform:translateX(-100%);
  transition:.2s;
 }

 .app.menu-open .sidebar{
  transform:translateX(0);
 }

 .content{
  margin-left:0;
  width:100%;
  padding:68px 15px 20px;
 }

 .mobile-menu{
  display:block;
 }

 .grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
 }

 .grid2,
 .grid3{
  grid-template-columns:1fr;
 }

 .quick-grid,
 .calc-grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
 }
}

@media(max-width:550px){

 .grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
 }

 .quick-grid,
 .calc-grid{
  grid-template-columns:1fr;
 }

 .page-header{
  display:block;
 }

 .page-header .row{
  margin-top:10px;
 }

 .card{
  padding:13px;
 }

 .page-header h1{
  font-size:23px;
 }
}

@media print{

 .sidebar,
 .mobile-menu,
 .no-print{
  display:none!important;
 }

 .content{
  margin:0;
  width:100%;
  padding:0;
 }

 .card{
  box-shadow:none;
 }
}
</style>
</head>

<body>

<div class="app" id="app">

<aside class="sidebar">

<div class="brand">
⚙️ Engineering Workbench
<small>Mechanical • Hydraulic • Maintenance</small>
</div>

<nav class="nav" id="navigation"></nav>

<div style="margin-top:20px">
<button class="btn" style="width:100%" onclick="toggleDark()">☾ Dark Mode</button>
</div>

</aside>

<button class="mobile-menu btn" onclick="toggleMenu()">☰</button>

<main class="content" id="content"></main>

</div>

<script>

/* =========================================================
   ENGINEERING WORKBENCH
   Local/offline single-file application
========================================================= */

const STORAGE_KEY="engineering_workbench_v4";

const emptyDatabase={
 machines:[],
 faults:[],
 maintenance:[],
 safety:[],
 parts:[],
 reports:[],
 projects:[],
 calculations:[],
 notes:[]
};

let db=loadDatabase();
let currentPage="dashboard";
let selectedMachine=null;
let reportToPrint=null;

const navigation=[
 ["dashboard","🏠 Dashboard"],
 ["machines","🏭 Machines"],
 ["faults","🔧 Fault Finding"],
 ["maintenance","🛠️ Maintenance"],
 ["safety","🦺 Safety"],
 ["engineering","⚙️ Engineering Mode"],
 ["hydraulics","💧 Hydraulics"],
 ["mechanical","🔩 Mechanical"],
 ["machining","🏗️ Machining"],
 ["parts","📦 Parts"],
 ["reports","📋 Reports"],
 ["projects","📐 Projects"]
];

function loadDatabase(){

 try{
  const saved=localStorage.getItem(STORAGE_KEY);

  if(!saved){
   return structuredClone(emptyDatabase);
  }

  return {
   ...structuredClone(emptyDatabase),
   ...JSON.parse(saved)
  };

 }catch(e){
  return structuredClone(emptyDatabase);
 }
}

function saveDatabase(){
 localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
}

function uid(){
 return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function esc(value){
 return String(value ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function machineName(id){

 if(!id) return "Unassigned";

 const machine=db.machines.find(m=>m.id===id);

 return machine ? machine.name : "Unknown machine";
}

function machineOptions(selected=""){

 return db.machines.map(m=>`
  <option value="${m.id}" ${m.id===selected?"selected":""}>
   ${esc(m.name)}
  </option>
 `).join("");
}

function toggleMenu(){
 document.getElementById("app").classList.toggle("menu-open");
}

function go(page){
 currentPage=page;
 selectedMachine=null;
 render();
 document.getElementById("app").classList.remove("menu-open");
}

function renderNavigation(){

 document.getElementById("navigation").innerHTML=
 navigation.map(([key,label])=>`
  <button
   class="${currentPage===key?"active":""}"
   onclick="go('${key}')">
   ${label}
  </button>
 `).join("");
}

function pageHeader(title,subtitle=""){

 renderNavigation();

 document.getElementById("content").innerHTML=`

 <div class="page-header">

  <div>
   <h1>${title}</h1>
   <p>${subtitle}</p>
  </div>

  <div class="row no-print">

   <button class="btn" onclick="backupDatabase()">
    Backup
   </button>

   <button class="btn" onclick="document.getElementById('restoreFile').click()">
    Restore
   </button>

   <input
    id="restoreFile"
    type="file"
    accept=".json"
    style="display:none"
    onchange="restoreDatabase(this)">

  </div>

 </div>

 `;
}

function render(){

 if(currentPage==="dashboard") dashboard();
 else if(currentPage==="machines") machines();
 else if(currentPage==="faults") faults();
 else if(currentPage==="maintenance") maintenance();
 else if(currentPage==="safety") safety();
 else if(currentPage==="engineering") engineering();
 else if(currentPage==="hydraulics") hydraulics();
 else if(currentPage==="mechanical") mechanical();
 else if(currentPage==="machining") machining();
 else if(currentPage==="parts") parts();
 else if(currentPage==="reports") reports();
 else if(currentPage==="projects") projects();
}

/* =========================================================
   DASHBOARD
========================================================= */

function dashboard(){

 pageHeader(
  "Engineering Workbench",
  "Mechanical engineering, maintenance and fault-finding workspace"
 );

 const openFaults=db.faults.filter(f=>f.status!=="Closed").length;
 const activeMaintenance=db.maintenance.filter(m=>m.status!=="Complete").length;
 const lowStock=db.parts.filter(p=>Number(p.stock)<=Number(p.minimum)).length;

 document.getElementById("content").innerHTML+=`

 <div class="grid">

  <div class="card stat">
   <strong>${db.machines.length}</strong>
   <span>Machines</span>
  </div>

  <div class="card stat">
   <strong>${openFaults}</strong>
   <span>Open faults</span>
  </div>

  <div class="card stat">
   <strong>${activeMaintenance}</strong>
   <span>Active maintenance</span>
  </div>

  <div class="card stat">
   <strong>${lowStock}</strong>
   <span>Low-stock parts</span>
  </div>

 </div>

 <div class="card">

  <div class="between">
   <h3>Quick Access</h3>
  </div>

  <div class="quick-grid">

   <button class="quick" onclick="go('faults')">
    <b>🔧 Fault Finding</b>
    <span>Record symptoms, measurements and ranked possible causes.</span>
   </button>

   <button class="quick" onclick="go('maintenance')">
    <b>🛠️ Maintenance</b>
    <span>Preventive, corrective and breakdown maintenance.</span>
   </button>

   <button class="quick" onclick="go('engineering')">
    <b>⚙️ Engineering</b>
    <span>Search engineering calculators by category.</span>
   </button>

   <button class="quick" onclick="go('reports')">
    <b>📋 Reports</b>
    <span>Create maintenance and engineering reports.</span>
   </button>

   <button class="quick" onclick="go('hydraulics')">
    <b>💧 Hydraulics</b>
    <span>Pressure, flow, temperature and hydraulic troubleshooting.</span>
   </button>

   <button class="quick" onclick="go('machining')">
    <b>🏗️ Machining</b>
    <span>RPM, feed, drilling and tapping calculations.</span>
   </button>

  </div>

 </div>

 <div class="grid2">

  <div class="card">

   <div class="between">
    <h3>Machine Status</h3>
    <button class="btn primary" onclick="go('machines')">
     Machines
    </button>
   </div>

   ${
    db.machines.length
    ?
    db.machines.map(m=>`

     <div class="history">

      <div class="between">

       <div>
        <b>${esc(m.name)}</b>
        <br>
        <span class="small">${esc(m.location||"")}</span>
       </div>

       <span class="badge ${
        m.status==="Running"
        ?"success"
        :
        m.status==="Faulted"
        ?"danger"
        :"warning"
       }">
        ${esc(m.status)}
       </span>

      </div>

     </div>

    `).join("")
    :
    `<div class="empty">No machines added yet.</div>`
   }

  </div>

  <div class="card">

   <h3>Recent Activity</h3>

   ${
    recentActivity().map(x=>`

     <div class="history">

      <b>${esc(x.title)}</b>

      <br>

      <span class="small">
       ${esc(x.text)}
       •
       ${new Date(x.date).toLocaleString()}
      </span>

     </div>

    `).join("")
    ||
    `<div class="empty">No activity yet.</div>`
   }

  </div>

 </div>

 <div class="card">

  <h3>Core Workflow</h3>

  <p>
   <b>
    Machine →
    Fault / Maintenance →
    Safety →
    Measurements →
    Troubleshooting →
    Repair →
    Test →
    Sign-off →
    Report →
    PDF →
    Machine History
   </b>
  </p>

  <div class="warning">
   This application is an engineering and maintenance aid only.
   Follow site procedures, manufacturer requirements and applicable
   NSW WHS requirements. Electrical isolation, testing, controls,
   wiring and electrical repairs must be performed by appropriately
   qualified personnel.
  </div>

 </div>
 `;
}

function recentActivity(){

 const activity=[];

 db.faults.forEach(x=>{
  activity.push({
   title:"Fault",
   text:x.title,
   date:x.date
  });
 });

 db.maintenance.forEach(x=>{
  activity.push({
   title:"Maintenance",
   text:x.title,
   date:x.date
  });
 });

 db.reports.forEach(x=>{
  activity.push({
   title:"Report",
   text:x.title,
   date:x.date
  });
 });

 db.projects.forEach(x=>{
  activity.push({
   title:"Project",
   text:x.name,
   date:x.date
  });
 });

 return activity
  .sort((a,b)=>new Date(b.date)-new Date(a.date))
  .slice(0,8);
}

/* =========================================================
   MACHINES
========================================================= */

function machines(){

 pageHeader(
  "Machines",
  "Machine register, history, maintenance, faults and machine-specific parts"
 );

 document.getElementById("content").innerHTML+=`

 <div class="card">

  <h3>Add Machine</h3>

  <form onsubmit="addMachine(event)">

   <div class="grid2">

    <div class="field">
     <label>Machine name / ID</label>
     <input id="machineName" required>
    </div>

    <div class="field">
     <label>Manufacturer / model</label>
     <input id="machineModel">
    </div>

    <div class="field">
     <label>Serial number</label>
     <input id="machineSerial">
    </div>

    <div class="field">
     <label>Location</label>
     <input id="machineLocation">
    </div>

    <div class="field">
     <label>Status</label>
     <select id="machineStatus">
      <option>Running</option>
      <option>Stopped</option>
      <option>Faulted</option>
      <option>Maintenance</option>
     </select>
    </div>

    <div class="field">
     <label>Criticality</label>
     <select id="machineCriticality">
      <option>Low</option>
      <option>Medium</option>
      <option>High</option>
      <option>Critical</option>
     </select>
    </div>

    <div class="field">
     <label>Operating hours</label>
     <input id="machineHours" type="number" step="0.1">
    </div>

   </div>

   <button class="btn primary">
    Add Machine
   </button>

  </form>

 </div>

 <div class="grid2">

 ${
 db.machines.map(m=>`

  <div class="card">

   <div class="between">

    <h3>${esc(m.name)}</h3>

    <span class="badge ${
     m.status==="Running"
     ?"success"
     :
     m.status==="Faulted"
     ?"danger"
     :"warning"
    }">
     ${esc(m.status)}
    </span>

   </div>

   <p>
    ${esc(m.model||"")}<br>
    <span class="small">
     SN: ${esc(m.serial||"—")}
     •
     ${esc(m.location||"—")}
    </span>
   </p>

   <div class="row">

    <button
     class="btn primary"
     onclick="openMachine('${m.id}')">
     Open Machine
    </button>

    <button
     class="btn danger"
     onclick="deleteRecord('machines','${m.id}')">
     Delete
    </button>

   </div>

  </div>

 `).join("")
 ||
 `<div class="card empty">No machines added yet.</div>`
 }

 </div>
 `;
}

function addMachine(event){

 event.preventDefault();

 db.machines.push({

  id:uid(),

  name:document.getElementById("machineName").value.trim(),

  model:document.getElementById("machineModel").value.trim(),

  serial:document.getElementById("machineSerial").value.trim(),

  location:document.getElementById("machineLocation").value.trim(),

  status:document.getElementById("machineStatus").value,

  criticality:document.getElementById("machineCriticality").value,

  hours:document.getElementById("machineHours").value,

  date:new Date().toISOString()

 });

 saveDatabase();

 render();
}

function openMachine(id){

 selectedMachine=id;

 const m=db.machines.find(x=>x.id===id);

 if(!m) return;

 document.getElementById("content").innerHTML=`

 <div class="page-header">

  <div>
   <h1>${esc(m.name)}</h1>
   <p>${esc(m.model||"")} • ${esc(m.location||"")}</p>
  </div>

  <button class="btn" onclick="go('machines')">
   ← Back
  </button>

 </div>

 <div class="grid">

  <div class="card stat">
   <strong>${db.faults.filter(x=>x.machine===id).length}</strong>
   <span>Faults</span>
  </div>

  <div class="card stat">
   <strong>${db.maintenance.filter(x=>x.machine===id).length}</strong>
   <span>Maintenance</span>
  </div>

  <div class="card stat">
   <strong>${db.parts.filter(x=>x.machine===id).length}</strong>
   <span>Parts</span>
  </div>

  <div class="card stat">
   <strong>${db.reports.filter(x=>x.machine===id).length}</strong>
   <span>Reports</span>
  </div>

 </div>

 <div class="grid2">

  <div class="card">

   <h3>Machine Details</h3>

   <p>
    <b>Serial:</b> ${esc(m.serial||"—")}<br>
    <b>Status:</b> ${esc(m.status)}<br>
    <b>Criticality:</b> ${esc(m.criticality)}<br>
    <b>Operating hours:</b> ${esc(m.hours||"—")}
   </p>

   <div class="row">

    <button class="btn primary"
     onclick="createFaultForMachine('${id}')">
     Report Fault
    </button>

    <button class="btn primary"
     onclick="createMaintenanceForMachine('${id}')">
     Maintenance
    </button>

    <button class="btn primary"
     onclick="newReport('${id}')">
     Write Report
    </button>

   </div>

  </div>

  <div class="card">

   <h3>Machine Parts</h3>

   ${
    db.parts.filter(x=>x.machine===id).map(x=>`

     <div class="history">

      <b>${esc(x.part)}</b>

      <br>

      ${esc(x.number||"")}

      <br>

      Stock:
      ${esc(x.stock)}
      /
      Min:
      ${esc(x.minimum)}

      ${
       Number(x.stock)<=Number(x.minimum)
       ?
       `<span class="badge danger">REORDER</span>`
       :
       ""
      }

     </div>

    `).join("")
    ||
    `<div class="empty">No parts assigned to this machine.</div>`
   }

  </div>

 </div>

 <div class="card">

function machineTimeline(machine){

 const timeline=[];

 db.faults
  .filter(x=>x.machine===machine)
  .forEach(x=>timeline.push({
   kind:"Fault",
   title:x.title,
   text:x.status,
   date:x.date
  }));

 db.maintenance
  .filter(x=>x.machine===machine)
  .forEach(x=>timeline.push({
   kind:"Maintenance",
   title:x.title,
   text:x.status,
   date:x.date
  }));

 db.safety
  .filter(x=>x.machine===machine)
  .forEach(x=>timeline.push({
   kind:"Safety",
   title:x.title,
   text:x.signoff||"Not signed off",
   date:x.date
  }));

 db.reports
  .filter(x=>x.machine===machine)
  .forEach(x=>timeline.push({
   kind:"Report",
   title:x.title,
   text:x.type,
   date:x.date
  }));

 db.calculations
  .filter(x=>x.machine===machine)
  .forEach(x=>timeline.push({
   kind:"Calculation",
   title:x.title,
   text:x.result,
   date:x.date
  }));

 return timeline.sort(
  (a,b)=>new Date(b.date)-new Date(a.date)
 );
}

function analyseFault(title,component,pressure,temp,flow,rpm,observations){

 const text=(
  title+" "+
  component+" "+
  observations
 ).toLowerCase();

 const causes=[];

 function add(name,score,checks){
  causes.push({
   name,
   score,
   checks
  });
 }

 if(
  text.includes("no pressure")||
  text.includes("low pressure")||
  text.includes("pressure drop")
 ){
  add(
   "Pump not developing required pressure",
   90,
   [
    "Compare pressure with specified operating condition",
    "Review pump operating condition",
    "Check suction and visible leakage where applicable",
    "Review relief/control path using authorised procedure"
   ]
  );
 }

 if(
  text.includes("no flow")||
  text.includes("low flow")||
  text.includes("slow")
 ){
  add(
   "Insufficient flow or flow restriction",
   88,
   [
    "Compare measured flow with required flow",
    "Check restrictions and valve conditions",
    "Review pump displacement and operating speed",
    "Check for internal leakage where applicable"
   ]
  );
 }

 if(
  text.includes("hot")||
  text.includes("overheat")||
  text.includes("temperature")||
  Number(temp)>80
 ){
  add(
   "Excessive heat generation or heat rejection problem",
   86,
   [
    "Check temperature trend",
    "Check for restrictions",
    "Review internal leakage / efficiency",
    "Check cooling conditions"
   ]
  );
 }

 if(
  text.includes("vibration")||
  text.includes("vibrat")||
  text.includes("noise")||
  text.includes("bearing")
 ){
  add(
   "Mechanical condition, alignment, bearing or cavitation issue",
   84,
   [
    "Observe vibration/noise safely",
    "Check mounting and alignment",
    "Review lubrication and bearing condition",
    "For hydraulics review suction conditions"
   ]
  );
 }

 if(
  text.includes("leak")||
  text.includes("oil")||
  text.includes("seal")
 ){
  add(
   "External or internal leakage",
   83,
   [
    "Identify leak location safely",
    "Inspect seals and fittings",
    "Check hose/component condition",
    "Compare performance for evidence of internal leakage"
   ]
  );
 }

 if(Number(pressure)>0 && Number(pressure)<20){
  add(
   "System pressure below expected range",
   80,
   [
    "Compare with OEM/site specification",
    "Review pump and load conditions",
    "Check authorised relief/control settings",
    "Inspect for leakage or restriction"
   ]
  );
 }

 if(
  text.includes("cavitation")||
  text.includes("whining")||
  text.includes("suction")
 ){
  add(
   "Possible cavitation or suction problem",
   89,
   [
    "Review inlet/suction conditions",
    "Check restrictions",
    "Check fluid level and condition",
    "Check for possible air ingress"
   ]
  );
 }

 if(
  text.includes("case drain")||
  text.includes("case-drain")
 ){
  add(
   "Possible internal hydraulic component leakage",
   87,
   [
    "Compare case drain against OEM limits",
    "Check temperature trend",
    "Review component efficiency",
    "Inspect component if limits are exceeded"
   ]
  );
 }

 if(!causes.length){

  add(
   "General component/system fault",
   50,
   [
    "Review machine history",
    "Compare measurements against OEM specifications",
    "Inspect likely failure points",
    "Record additional evidence before changing components"
   ]
  );

 }

 return causes
  .sort((a,b)=>b.score-a.score)
  .slice(0,5);
}

function addFault(event){

 event.preventDefault();

 const title=document.getElementById("faultTitle").value.trim();
 const component=document.getElementById("faultComponent").value.trim();
 const pressure=document.getElementById("faultPressure").value;
 const temp=document.getElementById("faultTemperature").value;
 const flow=document.getElementById("faultFlow").value;
 const rpm=document.getElementById("faultRPM").value;
 const observations=document.getElementById("faultObservations").value;

 const causes=analyseFault(
  title,
  component,
  pressure,
  temp,
  flow,
  rpm,
  observations
 );

 db.faults.unshift({

  id:uid(),

  machine:document.getElementById("faultMachine").value,

  component,

  title,

  severity:document.getElementById("faultSeverity").value,

  pressure,

  temperature:temp,

  flow,

  rpm,

  observations,

  causes,

  status:"Open",

  date:new Date().toISOString()

 });

 saveDatabase();

 render();
}

function filterCalculators(){

 const query=(
  document.getElementById("calculatorSearch")?.value||""
 ).toLowerCase();

 const category=
  document.getElementById("calculatorCategory")?.value||"All";

 const filtered=calculators.filter(c=>{

  const matchesCategory=
   category==="All"||
   c[3]===category;

  const matchesSearch=
   (c[1]+" "+c[2]).toLowerCase().includes(query);

  return matchesCategory&&matchesSearch;

 });

 document.getElementById("calculatorGrid").innerHTML=
 filtered.map(c=>`

  <button
   class="calc-card"
   onclick="openCalculator('${c[0]}')">

   <b>${c[1]}</b>

   <span>${c[2]}</span>

  </button>

 `).join("")
 ||
 `<div class="empty">No matching calculator.</div>`;
}

function fieldHTML(fields){

 return fields.map(f=>`

  <div class="field">

   <label>
    ${f[1]}
    ${f[2] ? " ("+f[2]+")" : ""}
   </label>

   <input
    id="calc_${f[0]}"
    type="number"
    step="any">

  </div>

 `).join("");
}

function openCalculator(key){

 const calc=calculators.find(x=>x[0]===key);

 if(!calc) return;

 document.getElementById("calculatorPanel").innerHTML=`

 <h3>${calc[1]}</h3>

 <p class="small">${calc[2]}</p>

 <div class="grid2">

  ${fieldHTML(calculatorFields[key]||[])}

 </div>

 <div class="field">

  <label>Save against machine (optional)</label>

  <select id="calcMachine">

   <option value="">None</option>

   ${machineOptions()}

  </select>

 </div>

 <button
  class="btn primary"
  onclick="calculate('${key}')">

  Calculate & Save

 </button>

 <div id="calculationResult"></div>

 `;
}

function cv(key){

 return Number(
  document.getElementById("calc_"+key)?.value||0
 );
}

function calculate(key){

 let result="";

 switch(key){

  case"force":
   result=(
    cv("pressure")*
    100000*
    cv("area")/1000000
   ).toFixed(2)+" N";
   break;

  case"torque":
   result=(
    cv("force")*
    cv("radius")
   ).toFixed(2)+" Nm";
   break;

  case"power":
   result=(
    cv("torque")*
    cv("rpm")/
    9550
   ).toFixed(3)+" kW";
   break;

  case"shaftStress":
   result=(
    16*
    cv("torque")*
    1000/
    (Math.PI*Math.pow(cv("diameter"),3))
   ).toFixed(2)+" MPa";
   break;

  case"shaftDiameter":
   result=Math.cbrt(
    16*
    cv("torque")*
    1000/
    (Math.PI*cv("stress"))
   ).toFixed(2)+" mm";
   break;

  case"stress":
   result=(
    cv("force")/
    cv("area")
   ).toFixed(3)+" MPa";
   break;

  case"strain":
   result=(
    cv("change")/
    cv("length")
   ).toFixed(6);
   break;

  case"beam":
   result=(
    cv("force")*
    Math.pow(cv("length"),3)/
    (3*cv("young")*cv("I"))
   ).toFixed(3)+" mm";
   break;

  case"gear":
   result=(
    cv("driven")/
    cv("driver")
   ).toFixed(4)+" : 1";
   break;

  case"belt":
   result=(
    Math.PI*
    cv("diameter")*
    cv("rpm")/
    60000
   ).toFixed(3)+" m/s";
   break;

  case"chain":
   result=(
    cv("pitch")/1000*
    cv("teeth")*
    cv("rpm")/60
   ).toFixed(3)+" m/s";
   break;

  case"spring":
   result=(
    cv("rate")*
    cv("deflection")
   ).toFixed(2)+" N";
   break;

  case"bolt":
   result=(
    .2*
    cv("preload")*
    cv("diameter")/1000
   ).toFixed(2)+" Nm approx.";
   break;

  case"pressure":
   result=(
    cv("force")/
    (cv("area")/1000000)/
    100000
   ).toFixed(2)+" bar";
   break;

  case"cylinderForce":
   result=(
    cv("pressure")*
    100000*
    Math.PI*
    Math.pow(cv("diameter")/1000,2)/
    4
   ).toFixed(1)+" N";
   break;

  case"cylinderSpeed":
   result=(
    cv("flow")/1000/
    (
     Math.PI*
     Math.pow(cv("diameter")/1000,2)/4
    )
   ).toFixed(3)+" m/s";
   break;

  case"hydPower":
   result=(
    cv("pressure")*
    cv("flow")/
    600
   ).toFixed(3)+" kW";
   break;

  case"pumpFlow":
   result=(
    cv("displacement")*
    cv("rpm")*
    (cv("efficiency")/100)/
    1000
   ).toFixed(2)+" L/min";
   break;

  case"motorTorque":
   result=(
    cv("pressure")*
    cv("displacement")*
    (cv("efficiency")/100)/
    62.83
   ).toFixed(2)+" Nm";
   break;

  case"thermal":
   result=(
    cv("alpha")*
    cv("length")*
    cv("deltaT")
   ).toFixed(3)+" mm";
   break;

  case"mass":
   result=(
    cv("density")*
    cv("volume")
   ).toFixed(3)+" kg";
   break;

  case"moment":
   result=(
    cv("force")*
    cv("distance")
   ).toFixed(2)+" Nm";
   break;

  case"lathe":
   result=(
    cv("speed")*
    1000/
    (Math.PI*cv("diameter"))
   ).toFixed(0)+" RPM";
   break;

  case"mill":
   result=(
    cv("teeth")*
    cv("chip")*
    cv("rpm")
   ).toFixed(2)+" mm/min";
   break;

  case"drill":
   result=(
    cv("speed")*
    1000/
    (Math.PI*cv("diameter"))
   ).toFixed(0)+" RPM";
   break;

  case"tap":
   result=(
    cv("diameter")-
    cv("pitch")
   ).toFixed(2)+" mm approx. tap drill";
   break;

 }

 document.getElementById("calculationResult").innerHTML=`

 <div class="result">
  Result: ${result}
 </div>

 `;

 const calc=calculators.find(x=>x[0]===key);

 db.calculations.unshift({

  id:uid(),

  title:calc[1],

  result,

  machine:document.getElementById("calcMachine").value,

  date:new Date().toISOString()

 });

 saveDatabase();
}

/* =========================================================
   DATABASE / BACKUP
========================================================= */

function deleteRecord(type,id){

 if(!confirm("Delete this record?")) return;

 if(!Array.isArray(db[type])) return;

 db[type]=db[type].filter(x=>x.id!==id);

 saveDatabase();

 render();
}

function backupDatabase(){

 const blob=new Blob(
  [JSON.stringify(db,null,2)],
  {type:"application/json"}
 );

 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");

 a.href=url;
 a.download="engineering-workbench-backup.json";

 document.body.appendChild(a);

 a.click();

 a.remove();

 URL.revokeObjectURL(url);
}

function restoreDatabase(input){

 const file=input.files[0];

 if(!file) return;

 const reader=new FileReader();

 reader.onload=function(){

  try{

   const restored=JSON.parse(reader.result);

   db={
    ...structuredClone(emptyDatabase),
    ...restored
   };

   saveDatabase();

   alert("Backup restored successfully.");

   render();

  }catch(e){

   alert("The selected file is not a valid Engineering Workbench backup.");

  }

 };

 reader.readAsText(file);
}

}

========================================================= */

if(
 localStorage.getItem("engineering_workbench_dark")==="true"
){

}
